services:
  image-embeddings:
    build: .
    image: pyparrot/image-embeddings:latest
    environment:
      IMAGE_EMBEDDING_BACKEND_MODEL: ${IMAGE_EMBEDDING_BACKEND_MODEL:-ViT-B-16-SigLIP}
      IMAGE_EMBEDDING_BACKEND_PRETRAINED: ${IMAGE_EMBEDDING_BACKEND_PRETRAINED:-webli}
      EMBEDDING_DEVICE: cuda
      HF_HOME: /cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['${IMAGE_EMBEDDING_BACKEND_GPU:-0}']
              capabilities: [gpu]
    ports:
      - '${IMAGE_EMBEDDING_PORT:-8010}:8010'
    volumes:
      - image-embedding-cache:/cache
    healthcheck:
      test: ['CMD', 'python', '-c', 'import urllib.request; urllib.request.urlopen("http://localhost:8010/readyz", timeout=5)']
      interval: 30s
      timeout: 10s
      start_period: 300s
    restart: on-failure
volumes:
  image-embedding-cache: {}
